# ============================================================================
# 希尔薇图集 · 本地/单机环境编排
#   MySQL 8.0 + RustFS（S3 兼容对象存储）+ API（Hono）+ Web（Next.js）+ Admin（React/Nginx）
#
# 启动全部：docker compose -f scripts/docker-compose.yml up -d --build
# 仅基础服务：docker compose -f scripts/docker-compose.yml up -d mysql rustfs
# 可观测性：docker compose -f scripts/docker-compose.yml --profile observability up -d
# 停止：    docker compose -f scripts/docker-compose.yml down
# 重置：    docker compose -f scripts/docker-compose.yml down -v（会清空数据）
#
# 首次启动且 mysql_data 卷为空时，会依次执行：
#   1) docs/美女写真网站-v1数据库设计.sql（24 张表 + 基础种子）
#   2) scripts/init/02-demo-data.sql（演示作者/图集/图片/公告等）
#
# 生产部署时请务必替换 MySQL 密码、JWT_SECRET 与 RustFS 密钥，并配置 HTTPS。
# 环境变量可写入同目录 .env（参考 .env.example）。
# ============================================================================
name: sylvie-gallery

services:
  mysql:
    image: mysql:8.0
    container_name: sylvie-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sylvie_gallery}
      MYSQL_USER: ${MYSQL_USER:-sylvie}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - '${MYSQL_PORT:-3306}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      # 仅在数据目录为空（首次初始化）时执行，按文件名顺序执行
      - ../docs/美女写真网站-v1数据库设计.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./init/02-demo-data.sql:/docker-entrypoint-initdb.d/02-demo-data.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    # Redis：API 缓存与限流，支持多实例共享计数
    image: redis:7.4
    container_name: sylvie-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  rabbitmq:
    # RabbitMQ：支付成功等异步事件的消息队列
    image: rabbitmq:4.4
    container_name: sylvie-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-sylvie}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-123456}
      TZ: Asia/Shanghai
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  mailpit:
    # Mailpit：开发环境邮件捕获，网页端查看验证码 / 通知邮件
    image: axllent/mailpit:latest
    container_name: sylvie-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-1000}
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_DATABASE: /data/mailpit.db
      TZ: Asia/Shanghai
    ports:
      - '${MAILPIT_UI_PORT:-8025}:8025'
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
    volumes:
      - mailpit_data:/data

  rustfs:
    # RustFS：S3 兼容对象存储，保存头像与图集原图
    image: rustfs/rustfs:latest
    container_name: sylvie-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      TZ: Asia/Shanghai
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - rustfs_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    stop_grace_period: 15s

  api:
    build:
      context: ../gallery-monorepo
      dockerfile: apps/api/Dockerfile
    image: sylvie-api:local
    container_name: sylvie-api
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-sylvie}
      DB_PASSWORD: ${MYSQL_PASSWORD:-123456}
      DB_NAME: ${MYSQL_DATABASE:-sylvie_gallery}
      DB_CONNECTION_LIMIT: ${DB_CONNECTION_LIMIT:-10}
      JWT_SECRET: ${JWT_SECRET:-sylvie-dev-secret-change-me-please}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-604800}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001,http://localhost:3002,http://localhost:8080,http://localhost:8081}
      S3_ENDPOINT: http://rustfs:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_BUCKET: ${S3_BUCKET:-sylvie}
      S3_FORCE_PATH_STYLE: 'true'
      VERIFY_CODE_DEMO: ${VERIFY_CODE_DEMO:-123456}
      ALIPAY_MOCK: ${ALIPAY_MOCK:-true}
      CACHE_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_PREFIX: ${CACHE_PREFIX:-sylvie}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      JOB_ENABLED: ${JOB_ENABLED:-true}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-2}
      JOB_VIP_SWEEP_CRON: "${JOB_VIP_SWEEP_CRON:-*/10 * * * *}"
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-希尔薇图集 <noreply@sylvie.cc>}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      # 本地开发默认开放写工具；生产部署请显式设为 false，或在后台只签发只读令牌
      MCP_ALLOW_WRITE: ${MCP_ALLOW_WRITE:-true}
      # 可观测性（OpenTelemetry → Alloy → Prometheus / Loki / Tempo / Grafana）
      # 默认关闭；启动 observability profile 后把 OBSERVABILITY_ENABLED 设为 true。
      OBSERVABILITY_ENABLED: ${OBSERVABILITY_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-sylvie-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://alloy:4318}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_TRACES_ENABLED: ${OTEL_TRACES_ENABLED:-true}
      OTEL_METRICS_ENABLED: ${OTEL_METRICS_ENABLED:-true}
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-1}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-15000}
      OTEL_DISABLED_INSTRUMENTATIONS: ${OTEL_DISABLED_INSTRUMENTATIONS:-}
      MQ_ENABLED: ${MQ_ENABLED:-true}
      MQ_URL: amqp://${RABBITMQ_USER:-sylvie}:${RABBITMQ_PASSWORD:-123456}@rabbitmq:5672
      MQ_QUEUE_PREFIX: ${MQ_QUEUE_PREFIX:-sylvie}
      MQ_PREFETCH: ${MQ_PREFETCH:-1}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-https://openapi-sandbox.dl.alipaydev.com/gateway.do}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-http://localhost:3000/api/orders/alipay/notify}
      ALIPAY_RETURN_URL: ${ALIPAY_RETURN_URL:-http://localhost:3001/membership}
      ALIPAY_SIGN_TYPE: ${ALIPAY_SIGN_TYPE:-RSA2}
      ALIPAY_KEY_TYPE: ${ALIPAY_KEY_TYPE:-PKCS8}
      TZ: Asia/Shanghai
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    stop_grace_period: 15s

  web:
    build:
      context: ../gallery-monorepo
      dockerfile: apps/web/Dockerfile
      args:
        API_BASE_URL: http://api:3000
    image: sylvie-web:local
    container_name: sylvie-web
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      TZ: Asia/Shanghai
    ports:
      - '${WEB_PORT:-8080}:3001'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 10s

  admin:
    build:
      context: ../gallery-monorepo
      dockerfile: apps/admin/Dockerfile
      args:
        WEB_URL: ${WEB_PUBLIC_URL:-http://localhost:8080}
    image: sylvie-admin:local
    container_name: sylvie-admin
    restart: unless-stopped
    init: true
    environment:
      TZ: Asia/Shanghai
    ports:
      - '${ADMIN_PORT:-8081}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1/ >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    stop_grace_period: 10s

  # ==========================================================================
  # 可观测性栈（按需启动）
  #   docker compose -f scripts/docker-compose.yml --profile observability up -d
  #   Grafana：http://localhost:3030（admin / 123456）
  #   Alloy OTLP：4317（gRPC）/ 4318（HTTP）
  #   启用后还需在 scripts/.env 或 apps/api/.env 设置 OBSERVABILITY_ENABLED=true
  # ==========================================================================
  alloy:
    image: grafana/alloy:latest
    container_name: sylvie-alloy
    restart: unless-stopped
    profiles: ['observability']
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --stability.level=experimental
      - /etc/alloy/config.alloy
    ports:
      - '${ALLOY_OTLP_GRPC_PORT:-4317}:4317'
      - '${ALLOY_OTLP_HTTP_PORT:-4318}:4318'
      - '${ALLOY_UI_PORT:-12345}:12345'
    volumes:
      - ./observability/alloy.alloy:/etc/alloy/config.alloy:ro
      # 采集各业务容器的 stdout 日志。
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - prometheus
      - loki
      - tempo

  prometheus:
    image: prom/prometheus:latest
    container_name: sylvie-prometheus
    restart: unless-stopped
    profiles: ['observability']
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      # Alloy 通过 remote write 写入 OTLP 指标，必须显式开启接收。
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:latest
    container_name: sylvie-loki
    restart: unless-stopped
    profiles: ['observability']
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - '${LOKI_PORT:-3100}:3100'
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  tempo:
    image: grafana/tempo:latest
    container_name: sylvie-tempo
    restart: unless-stopped
    profiles: ['observability']
    command:
      - -config.file=/etc/tempo/tempo.yml
    ports:
      - '${TEMPO_PORT:-3200}:3200'
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:latest
    container_name: sylvie-grafana
    restart: unless-stopped
    profiles: ['observability']
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-123456}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sylvie-api.json
      TZ: Asia/Shanghai
    ports:
      - '${GRAFANA_PORT:-3030}:3000'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  mailpit_data:
    name: sylvie_mailpit_data
  rabbitmq_data:
    name: sylvie_rabbitmq_data
  mysql_data:
    name: sylvie_mysql_data
  redis_data:
    name: sylvie_redis_data
  rustfs_data:
    name: sylvie_rustfs_data
  alloy_data:
    name: sylvie_alloy_data
  prometheus_data:
    name: sylvie_prometheus_data
  loki_data:
    name: sylvie_loki_data
  tempo_data:
    name: sylvie_tempo_data
  grafana_data:
    name: sylvie_grafana_data
